# SwiftLint for the kit, the adapters and the apps (docs/modules/Tooling.md). CI runs
# `swiftlint lint --strict`, so every warning fails the build; run `swiftlint` before pushing.
included:
  - Packages/TitanKit/Sources
  - Packages/TitanKit/Tests
  - Adapters/TitanFirebase/Sources
  - Apps
excluded:
  - "**/.build"
  - "**/Derived"
  - "**/*.generated.swift"

opt_in_rules:
  - force_unwrapping

disabled_rules:
  # Multi-line literals end with a comma here, so adding an item touches one line.
  - trailing_comma
  # Short names like `id`, `x` and enum cases like `vi` read fine in context.
  - identifier_name
  # Generic parameters and nested types such as `Router<Route>.Destination`.
  - nesting
  - todo
  # SwiftUI's own shape: Button { } label: { }, Section { } header: { }.
  - multiple_closures_with_trailing_closure
  # Small (value, label, detail) tuples in tests and view helpers.
  - large_tuple
  # Badge names come from the Figma design ("Streak Master").
  - inclusive_language

line_length:
  warning: 160
  error: 250
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 450
  error: 600

function_body_length:
  warning: 100
  error: 150

cyclomatic_complexity:
  warning: 12
  error: 20
  ignores_case_statements: true
