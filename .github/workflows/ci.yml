name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: TitanKit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test all kit modules
        run: Tools/ci-test-kit.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kit-log
          path: build-kit.log

  app:
    name: ${{ matrix.app }} build and tests
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [Dolingo]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Generate, build and test
        run: Tools/ci-test-app.sh ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.app }}-log
          path: build-${{ matrix.app }}.log

  backend:
    name: dolingo-ai server checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Backend/dolingo-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/dolingo-ai/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Test
        run: npm test
